<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rowing at Home — 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: #87CEEB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    canvas { display: block; position: relative; z-index: 0; }

    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 16px 20px; pointer-events: none;
    }
    #hud-left, #hud-right {
      background: rgba(200, 220, 240, 0.75); backdrop-filter: blur(8px);
      border-radius: 12px; padding: 14px 18px; color: #1a2a3a;
      font-size: 14px; line-height: 1.6;
      pointer-events: auto;
    }
    #hud-left { min-width: 200px; cursor: pointer; }
    #hud-right {
      text-align: right; font-family: "SF Mono", Monaco, Consolas, monospace; font-size: 12px;
      max-width: 320px; max-height: 280px; overflow: hidden;
      display: none;
    }
    #hud-right.visible { display: block; }
    .stat-row { display: flex; justify-content: space-between; gap: 16px; }
    .stat-label { color: #5a7a9a; }
    .stat-value { font-weight: bold; }
    .stat-big { font-size: 20px; color: #00796B; }
    .disconnected { color: #C62828; }
    .connected { color: #00796B; }

    #splits-panel {
      position: fixed; top: 16px; right: 20px; z-index: 10;
      background: rgba(20, 30, 50, 0.75); backdrop-filter: blur(8px);
      border-radius: 12px; padding: 12px 16px;
      color: #cde; font-family: "SF Mono", Monaco, Consolas, monospace; font-size: 13px;
      min-width: 200px; max-height: 60vh; overflow-y: auto;
      pointer-events: auto; display: none;
    }
    #splits-panel.visible { display: block; }
    #splits-panel .splits-title {
      color: #FFA726; font-size: 12px; text-transform: uppercase;
      letter-spacing: 2px; margin-bottom: 8px; text-align: center;
    }
    #splits-list { line-height: 1.7; }
    #splits-list .split-row {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    #splits-list .split-row:last-child { border-bottom: none; }
    #splits-list .split-dist { color: #8ab; }
    #splits-list .split-times { color: #fff; }
    #splits-list .split-partial { color: #FFA726; }

    #controls {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: center; gap: 12px;
      padding: 16px 20px; pointer-events: none;
    }
    #connect-btn, #camera-btn, #stroke-btn, #stop-btn, #newgame-btn {
      pointer-events: auto;
      padding: 12px 28px; font-size: 15px;
      border: none; border-radius: 8px; cursor: pointer;
      background: #4A90D9; color: #fff; transition: background .2s;
    }
    #connect-btn:hover, #camera-btn:hover, #stroke-btn:hover, #stop-btn:hover, #newgame-btn:hover { background: #5BA0E9; }
    #connect-btn:disabled, #camera-btn:disabled, #stroke-btn:disabled, #stop-btn:disabled, #newgame-btn:disabled { opacity: .5; cursor: default; }
    #camera-btn, #stroke-btn, #stop-btn { background: #6B7B8E; }
    #camera-btn:hover, #stroke-btn:hover, #stop-btn:hover { background: #7B8B9E; }
    #newgame-btn { background: #4CAF50; }
    #newgame-btn:hover { background: #66BB6A; }

    #pause-overlay {
      position: fixed; inset: 0; z-index: 50;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(200, 220, 240, 0.8); backdrop-filter: blur(6px);
    }
    #pause-overlay.visible { display: flex; }
    #pause-menu {
      background: rgba(240, 245, 250, 0.95);
      border: 1px solid #A0B8D0;
      border-radius: 16px; padding: 40px 48px;
      text-align: center; min-width: 320px;
    }
    #pause-menu h2 { color: #F57C00; font-size: 28px; margin-bottom: 24px; }
    #pause-menu .summary { color: #5a7a9a; font-size: 14px; margin-bottom: 24px; line-height: 1.8; }
    #pause-menu .summary span { color: #00796B; font-weight: bold; }
    .pause-btn {
      display: block; width: 100%; margin: 8px 0;
      padding: 14px 24px; font-size: 16px;
      border: none; border-radius: 10px; cursor: pointer;
      color: #fff; transition: background .2s;
    }
    .pause-btn:hover { opacity: 0.85; }
    #btn-resume { background: #4A90D9; }
    #btn-save   { background: #4CAF50; }
    #btn-list   { background: #7E57C2; }
    #btn-reset  { background: #EF5350; }

    /* --- Diálogo de nombre para guardar --- */
    #save-name-overlay {
      position: fixed; inset: 0; z-index: 60;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(200, 220, 240, 0.85); backdrop-filter: blur(6px);
    }
    #save-name-overlay.visible { display: flex; }
    #save-name-box {
      background: rgba(240, 245, 250, 0.95);
      border: 1px solid #A0B8D0;
      border-radius: 16px; padding: 36px 40px;
      text-align: center; min-width: 340px;
    }
    #save-name-box h3 { color: #F57C00; font-size: 20px; margin-bottom: 20px; }
    #save-name-input {
      width: 100%; padding: 12px 16px; font-size: 16px;
      border: 1px solid #A0B8D0; border-radius: 8px;
      background: #fff; color: #1a2a3a; margin-bottom: 16px;
      box-sizing: border-box;
    }
    #save-name-input:focus { outline: none; border-color: #4A90D9; }
    #save-name-box .pause-btn { margin: 6px 0; }
    #btn-save-confirm { background: #4CAF50; }
    #btn-save-cancel { background: #EF5350; }

    /* --- Lista de entrenamientos guardados --- */
    #saves-list-overlay {
      position: fixed; inset: 0; z-index: 60;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(200, 220, 240, 0.85); backdrop-filter: blur(6px);
    }
    #saves-list-overlay.visible { display: flex; }
    #saves-list-box {
      background: rgba(240, 245, 250, 0.95);
      border: 1px solid #A0B8D0;
      border-radius: 16px; padding: 36px 40px;
      min-width: 460px; max-width: 600px; max-height: 80vh;
      overflow-y: auto;
    }
    #saves-list-box h3 { color: #F57C00; font-size: 20px; margin-bottom: 20px; text-align: center; }
    .save-entry {
      background: rgba(220, 230, 245, 0.8);
      border: 1px solid #A0B8D0;
      border-radius: 10px; padding: 14px 18px;
      margin-bottom: 10px; display: flex;
      align-items: center; gap: 12px;
    }
    .save-info { flex: 1; min-width: 0; }
    .save-name { color: #00796B; font-weight: bold; font-size: 15px; }
    .save-date { color: #5a7a9a; font-size: 12px; }
    .save-stats { color: #1a2a3a; font-size: 12px; margin-top: 4px; }
    .save-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .save-actions button {
      padding: 8px 12px; font-size: 13px;
      border: none; border-radius: 6px; cursor: pointer;
      color: #fff; transition: opacity .2s;
    }
    .save-actions button:hover { opacity: 0.8; }
    .btn-export-save { background: #4CAF50; }
    .btn-delete-save { background: #EF5350; }
    #saves-empty { color: #5a7a9a; text-align: center; padding: 30px; font-size: 14px; }

    /* --- Menú de nueva partida --- */
    #newgame-overlay {
      position: fixed; inset: 0; z-index: 60;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(200, 220, 240, 0.85); backdrop-filter: blur(6px);
    }
    #newgame-overlay.visible { display: flex; }
    #newgame-box {
      background: rgba(240, 245, 250, 0.95);
      border: 1px solid #A0B8D0;
      border-radius: 16px; padding: 36px 40px;
      text-align: center; min-width: 300px;
    }
    #newgame-box h2 { color: #F57C00; font-size: 24px; margin-bottom: 20px; }
    .goal-section { color: #5a7a9a; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 8px; }
    .goal-btn {
      display: block; width: 100%; margin: 6px 0;
      padding: 12px 24px; font-size: 15px;
      border: none; border-radius: 8px; cursor: pointer;
      color: #fff; background: #4A90D9; transition: background .2s;
    }
    .goal-btn:hover { background: #5BA0E9; }

    /* --- HUD de objetivo (centro de pantalla) --- */
    #goal-hud {
      position: fixed; top: 8%; left: 50%; transform: translateX(-50%);
      z-index: 5; text-align: center; pointer-events: none;
      display: none;
    }
    #goal-hud.visible { display: block; }
    #goal-hud .goal-label {
      color: #8ab; font-size: 14px; text-transform: uppercase;
      letter-spacing: 2px; margin-bottom: 4px;
    }
    #goal-hud .goal-value {
      font-size: 72px; font-weight: bold; color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      font-family: "SF Mono", Monaco, Consolas, monospace;
    }
    #goal-hud .goal-value.finished { color: #e9c46a; }
    #goal-hud .goal-sub { color: #8ab; font-size: 16px; margin-top: 4px; }
    #goal-hud .goal-rower {
      font-size: 28px; font-weight: bold; color: #FFA726;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      font-family: "SF Mono", Monaco, Consolas, monospace;
      margin-top: 6px; min-height: 28px;
    }
    #goal-hud .goal-time {
      font-size: 72px; font-weight: bold; color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      font-family: "SF Mono", Monaco, Consolas, monospace;
      min-height: 72px;
    }

    #log {
      font-family: "SF Mono", Monaco, Consolas, monospace; font-size: 11px;
      color: #8ab; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto;
    }
    #log .hex { color: #4ecca3; }
    #log .cmd { color: #6ab0f3; }
    #log .svc { color: #e94560; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>

<div id="hud">
  <div id="hud-left">
    <div class="stat-row"><span class="stat-label">Speed</span><span class="stat-value stat-big" id="s-speed">0.0</span></div>
    <div class="stat-row"><span class="stat-label">km/h</span><span class="stat-value stat-label" id="s-speed-unit">&nbsp;</span></div>

<script type="module">
import * as THREE from 'three';

// ========================================================================
//  THREE.JS — ESCENA LOW-POLY
// ========================================================================

let scene, camera, renderer, clock;
let boat;
const riverSegments = [];
let cameraMode = 0; // 0: chase, 1: side, 2: cinematic
const CAM_MODES = ['Chase', 'Side', 'Cinematic'];
const bots = [];
let paused = false;

// ========================================================================
//  SISTEMA DE GUARDADO — N entrenamientos con nombre y fecha
// ========================================================================
const SAVE_PREFIX = 'rowingAtHome_save_';

function getAllSaves() {
  const saves = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith(SAVE_PREFIX)) {
      try {
        saves.push(JSON.parse(localStorage.getItem(key)));
      } catch (e) { /* skip corrupt */ }
    }
  }
  saves.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
  return saves;
}

function saveProgress(name) {
  const dist = gameState.gameDistance;
  const data = {
    id: 'save_' + Date.now(),
    name: name || ('Entrenamiento ' + new Date().toLocaleDateString('es-ES')),
    strokes: gameState.strokes,
    distance: Math.round(dist),
    gameDistance: gameState.gameDistance,
    calories: gameState.calories,
    avgCadence: gameState.avgCadence || 0,
    avgHeartRate: gameState.avgHeartRate || 0,
    maxHeartRate: gameState.maxHeartRate || 0,
    resistance: gameState.resistance || 0,
    durationSec: gameState.exerciseTime || 0,
    boatZ: gameState.boatZ,
    savedAt: Date.now(),
  };
  localStorage.setItem(SAVE_PREFIX + data.id, JSON.stringify(data));
  return data;
}

function loadProgress(id) {
  const raw = localStorage.getItem(SAVE_PREFIX + id);
  if (!raw) return false;
  try {
    const data = JSON.parse(raw);
    gameState.strokes = data.strokes || 0;
    gameState.distance = data.distance || 0;
    gameState.gameDistance = data.gameDistance || 0;
    gameState.gameDistance = data.gameDistance || data.distance || 0;
    gameState.bleDistanceTarget = data.distance || 0;
    gameState.lastBLEDistance = data.distance || 0;
    gameState.calories = data.calories || 0;
    gameState.exerciseTime = data.durationSec || 0;
    gameState.boatZ = data.boatZ || 0;
    gameState.boatVelocity = 0;
    if (boat) {
      boat.position.z = gameState.boatZ;
      boat.position.x = riverCurveX(gameState.boatZ);
      boat.rotation.y = riverHeading(gameState.boatZ);
    }
    $sStrokes.textContent = gameState.strokes;
    $sDist.textContent = Math.round(gameState.gameDistance) + ' m';
    $sCal.textContent = gameState.calories + ' kcal';
    $sSpeed.textContent = '0.0';
    $sTime.textContent = formatDuration(gameState.exerciseTime);
    return true;
  } catch (e) {
    return false;
  }
}

function deleteProgress(id) {
  localStorage.removeItem(SAVE_PREFIX + id);
}

function hasSavedProgress() {
  for (let i = 0; i < localStorage.length; i++) {
    if (localStorage.key(i).startsWith(SAVE_PREFIX)) return true;
  }
  return false;
}

// --- Exportación a fichero TCX compatible con Strava ---
function estimateDuration(data) {
  if (data.durationSec && data.durationSec > 10) return data.durationSec;
  if (data.strokes > 0 && data.avgCadence > 0) {
    return Math.round(data.strokes / data.avgCadence * 60);
  }
  if (data.distance > 0) {
    // Estimar a 15 km/h promedio (ritmo de remo moderado)
    return Math.round(data.distance / (15 / 3.6));
  }
  return 600;
}

function formatTCXDate(ts) {
  return new Date(ts).toISOString().replace(/\.\d+Z$/, 'Z');
}

function formatDuration(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

function formatSplitTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  const ms = Math.floor((sec % 1) * 1000);
  return `${m}:${s.toString().padStart(2,'0')}.${ms.toString().padStart(3,'0')}`;
}

function resetSplits() {
  gameState.splits = [];
  gameState.lastSplitDistance = 0;
  gameState.lastSplitTime = 0;
  renderSplits();
  document.getElementById('splits-panel').classList.add('visible');
}

function renderSplits() {
  const list = document.getElementById('splits-list');
  list.innerHTML = '';
  gameState.splits.forEach(sp => {
    const row = document.createElement('div');
    row.className = 'split-row';
    row.innerHTML = `<span class="split-dist">${sp.dist}m</span>` +
      `<span class="split-times"><span class="split-partial">${formatSplitTime(sp.partial)}</span> / ${formatSplitTime(sp.total)}</span>`;
    list.appendChild(row);
  });
}

function checkSplits() {
  const dist = gameState.gameDistance;
  const nextSplit = gameState.lastSplitDistance + 500;
  if (dist >= nextSplit) {
    const total = gameState.exerciseTime;
    const partial = total - gameState.lastSplitTime;
    gameState.splits.push({ dist: nextSplit, partial, total });
    gameState.lastSplitDistance = nextSplit;
    gameState.lastSplitTime = total;
    renderSplits();
  }
}

function exportToTCX(data) {
  const duration = estimateDuration(data);
  const distance = data.distance || 0;
  const calories = data.calories || 0;
  const avgHR = data.avgHeartRate || 0;
  const maxHR = data.maxHeartRate || avgHR || 0;
  const startTime = data.savedAt || Date.now();
  const startStr = formatTCXDate(startTime);

  // TCX sin trackpoints (sin GPS). Strava lo acepta como ejercicio manual.
  // Usamos Activity > Lap con datos agregados.
  let tcx = `<?xml version="1.0" encoding="UTF-8"?>\n`;
  tcx += `<TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2">\n`;
  tcx += `  <Activities>\n`;
  tcx += `    <Activity Sport="Rowing">\n`;
  tcx += `      <Id>${startStr}</Id>\n`;
  tcx += `      <Lap StartTime="${startStr}">\n`;
  tcx += `        <TotalTimeSeconds>${duration}</TotalTimeSeconds>\n`;
  tcx += `        <DistanceMeters>${distance}</DistanceMeters>\n`;
  tcx += `        <MaximumSpeed>0</MaximumSpeed>\n`;
  tcx += `        <Calories>${calories}</Calories>\n`;
  if (avgHR > 0) {
    tcx += `        <AverageHeartRateBpm><Value>${Math.round(avgHR)}</Value></AverageHeartRateBpm>\n`;
  }
  if (maxHR > 0) {
    tcx += `        <MaximumHeartRateBpm><Value>${Math.round(maxHR)}</Value></MaximumHeartRateBpm>\n`;
  }
  tcx += `        <Intensity>Active</Intensity>\n`;
  tcx += `        <TriggerMethod>Manual</TriggerMethod>\n`;

  // Generar trackpoints sintéticos para que Strava acepte el fichero
  // (Strava requiere al menos algunos trackpoints para procesar la actividad)
  const numPoints = Math.min(Math.max(Math.floor(duration / 10), 10), 500);
  const stepDuration = duration / numPoints;
  const stepDistance = distance / numPoints;
  for (let i = 0; i <= numPoints; i++) {
    const t = i * stepDuration;
    const d = i * stepDistance;
    const tcxTime = formatTCXDate(startTime + t * 1000);
    tcx += `        <Track>\n`;
    tcx += `          <Trackpoint>\n`;
    tcx += `            <Time>${tcxTime}</Time>\n`;
    tcx += `            <DistanceMeters>${d.toFixed(1)}</DistanceMeters>\n`;
    if (avgHR > 0) {
      const hr = Math.round(avgHR + (maxHR - avgHR) * Math.sin(i / numPoints * Math.PI));
      tcx += `            <HeartRateBpm><Value>${hr}</Value></HeartRateBpm>\n`;
    }
    tcx += `          </Trackpoint>\n`;
    tcx += `        </Track>\n`;
  }

  tcx += `      </Lap>\n`;
  tcx += `      <Notes>${data.name || 'Rowing session'} — Strokes: ${data.strokes || 0}</Notes>\n`;
  tcx += `    </Activity>\n`;
  tcx += `  </Activities>\n`;
  tcx += `</TrainingCenterDatabase>\n`;

  return tcx;
}

function downloadFile(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportSave(data) {
  const tcx = exportToTCX(data);
  const dateStr = new Date(data.savedAt).toISOString().slice(0, 10);
  const safeName = (data.name || 'rowing').replace(/[^a-zA-Z0-9_-]/g, '_');
  downloadFile(`${safeName}_${dateStr}.tcx`, tcx, 'application/vnd.garmin.tcx+xml');
}

// Estado del juego alimentado por BLE
const gameState = {
  speed: 0,          // km/h (mostrado en HUD, derivado de boatVelocity)
  cadence: 0,        // spm
  strokes: 0,
  distance: 0,       // metros (BLE, saltos de 100m)
  gameDistance: 0,   // metros acumulados por física + corrección gradual BLE
  bleDistanceTarget: 0, // objetivo BLE al que corregir
  lastBLEDistance: 0,   // último valor BLE recibido
  resistance: 0,     // 1-15 (BLE byte 14)
  calories: 0,       // kcal (BLE bytes 10-11)
  heartRate: 0,      // bpm (BLE byte 18)
  inclination: 0,    // 0-15 (BLE byte 21)
  boatZ: 0,          // posicion virtual del barco (world units)
  strokePhase: 0,    // 0..1 fase de la remada actual
  lastStrokeTime: 0,
  // Física del barco
  boatVelocity: 0,   // velocidad en unidades de mundo/s
  lastBLEStrokes: 0, // para detectar nuevas remadas del BLE
  lastImpulseTime: 0,
  // Estadísticas de entrenamiento (para exportar)
  exerciseTime: 0,   // segundos activos remando
  cadenceSum: 0,     // suma de cadencia para media
  cadenceSamples: 0, // nº de muestras
  heartRateSum: 0,
  heartRateSamples: 0,
  maxHeartRate: 0,
  // Objetivo del juego
  goalMode: 'free',    // 'time' | 'distance' | 'free'
  goalValue: 0,       // segundos o metros según el modo
  // Splits de 500m
  splits: [],         // [{dist, partial, total}]
  lastSplitDistance: 0,
  lastSplitTime: 0,
};

// Getters para medias (definidos como propiedades para que saveProgress los use)
Object.defineProperties(gameState, {
  avgCadence: { get() { return this.cadenceSamples > 0 ? this.cadenceSum / this.cadenceSamples : 0; } },
  avgHeartRate: { get() { return this.heartRateSamples > 0 ? this.heartRateSum / this.heartRateSamples : 0; } },
});

// --- Modelo físico del remo ---
// Cada remada aplica un impulso (delta de velocidad instantáneo).
// El rozamiento del agua es cuadrático: F_drag = -k*v² - c*v
// Velocidad terminal (steady state): v_t = sqrt(impulse * cadence / (60 * k))
const PHYS = {
  STROKE_IMPULSE: 0.35,   // delta de velocidad por remada (u/s)
  DRAG_QUAD: 0.02,         // coef. rozamiento cuadrático (agua)
  DRAG_LIN: 0.15,           // coef. rozamiento lineal (fricción residual)
  MIN_VELOCITY: 0.01,       // debajo de esto, parar
  MAX_VELOCITY: 3.5,        // tope (u/s) ≈ 17.5 km/h en HUD
  KM_H_FACTOR: 5.0,        // conversión u/s → km/h para display
  BLE_CADENCE_TIMEOUT: 4.0, // sin paquetes BLE tras N segundos, asumir parada
};
let lastBLEPacketTime = 0;

function applyStrokeImpulse() {
  // El impulso escala con la resistencia: a mayor resistencia, más fuerza
  // aplica el remero por stroke (más trabajo por remada).
  // resistance 1-15 → factor 0.5..1.6
  const r = gameState.resistance || 1;
  const resistFactor = 0.4 + (r / 15) * 1.2;
  gameState.boatVelocity += PHYS.STROKE_IMPULSE * resistFactor;
  if (gameState.boatVelocity > PHYS.MAX_VELOCITY) {
    gameState.boatVelocity = PHYS.MAX_VELOCITY;
  }
  gameState.lastImpulseTime = clock ? clock.elapsedTime : 0;
}

function updateBoatPhysics(dt) {
  const v = gameState.boatVelocity;
  // El drag también escala con la resistencia: más resistencia = más oposición
  const r = gameState.resistance || 1;
  const dragResist = 0.7 + (r / 15) * 0.6;
  // Rozamiento del agua: F = -(k*v² + c*v) en sentido opuesto al movimiento
  const drag = (PHYS.DRAG_QUAD * v * v + PHYS.DRAG_LIN * v) * dragResist;
  gameState.boatVelocity -= drag * dt;

  if (gameState.boatVelocity < PHYS.MIN_VELOCITY) {
    gameState.boatVelocity = 0;
  }

  // Si la cadencia viene del BLE, aplicar impulsos periódicamente basados en cadencia
  // (el BLE también detecta nuevas remadas vía stroke count, pero como los paquetes
  //  no llegan exactamente al ritmo de cada remada, usamos un modelo de cadencia suave)
  if (gameState.cadence > 0 && lastBLEPacketTime > 0) {
    const timeSinceBLE = clock.elapsedTime - lastBLEPacketTime;
    if (timeSinceBLE < PHYS.BLE_CADENCE_TIMEOUT) {
      // Aplicar impulsos al ritmo de la cadencia
      const strokeInterval = 60 / gameState.cadence;
      const timeSinceImpulse = clock.elapsedTime - gameState.lastImpulseTime;
      if (timeSinceImpulse >= strokeInterval) {
        applyStrokeImpulse();
      }
    }
  }

  // Actualizar velocidad mostrada
  gameState.speed = gameState.boatVelocity * PHYS.KM_H_FACTOR;

  // Mover barco
  const deltaZ = gameState.boatVelocity * dt;
  gameState.boatZ -= deltaZ;

  // Acumular distancia por física (avance suave cada frame)
  gameState.gameDistance += deltaZ * METERS_PER_UNIT;

  // --- Corrección gradual hacia el valor BLE ---
  // El remo reporta saltos de 100m. Cuando llega un nuevo valor BLE, se calcula
  // el error y se corrige gameDistance poco a poco (repartido en ~3 segundos)
  // para que no haya saltos bruscos pero sí converja al valor real.
  if (gameState.bleDistanceTarget > 0) {
    const error = gameState.bleDistanceTarget - gameState.gameDistance;
    if (Math.abs(error) > 0.5) {
      // Corregir una fracción del error por segundo (converge en ~3s)
      const correctionRate = error / 3.0;
      gameState.gameDistance += correctionRate * dt;
    }
  }

  // Acumular estadísticas de entrenamiento
  if (gameState.cadence > 0 || gameState.boatVelocity > 0) {
    gameState.exerciseTime += dt;
    if (gameState.cadence > 0) {
      gameState.cadenceSum += gameState.cadence;
      gameState.cadenceSamples++;
    }
  }

  // Splits de 500m
  checkSplits();

  $sTime.textContent = formatDuration(gameState.exerciseTime);
  if (gameState.heartRate > 0) {
    gameState.heartRateSum += gameState.heartRate;
    gameState.heartRateSamples++;
    if (gameState.heartRate > gameState.maxHeartRate) {
      gameState.maxHeartRate = gameState.heartRate;
    }
  }

  if (boat) {
    boat.position.z = gameState.boatZ;
    boat.position.x = riverCurveX(gameState.boatZ);
    boat.rotation.y = riverHeading(gameState.boatZ);
  }

  // Actualizar HUD de velocidad
  $sSpeed.textContent = gameState.speed.toFixed(1);
}

// --- Río ---
const RIVER_WIDTH = 14;
const SEGMENT_LENGTH = 20;
const NUM_SEGMENTS = 30;
// --- Curva del río ---
// El centro del río se desvía en X según una suma de senos (curva suave)
const CURVE_AMPLITUDE = 14;  // desviación máxima en X (uds)
const CURVE_FREQ = 0.008;    // frecuencia de la curva principal
const CURVE_FREQ2 = 0.017;   // frecuencia secundaria (variación)
// Fases aleatorias para que cada partida tenga un recorrido distinto
const CURVE_PHASE1 = Math.random() * Math.PI * 2;
const CURVE_PHASE2 = Math.random() * Math.PI * 2;

// Devuelve la X del centro del río en la posición Z dada
function riverCurveX(z) {
  return Math.sin(z * CURVE_FREQ + CURVE_PHASE1) * CURVE_AMPLITUDE
       + Math.sin(z * CURVE_FREQ2 + CURVE_PHASE2) * CURVE_AMPLITUDE * 0.35;
}

// Devuelve el ángulo de rumbo (heading) en radianes en la posición Z dada
// Es la derivada de riverCurveX: dX/dZ
function riverHeading(z) {
  return Math.atan(
    Math.cos(z * CURVE_FREQ + CURVE_PHASE1) * CURVE_AMPLITUDE * CURVE_FREQ
    + Math.cos(z * CURVE_FREQ2 + CURVE_PHASE2) * CURVE_AMPLITUDE * 0.35 * CURVE_FREQ2
  );
}

// --- Río infinito (paisaje procedural que se recicla) ---
const trees = [];
const mountains = [];
const TREE_POOL = 120;
const HORIZON = 0xCDE8F5;
const MOUNTAIN_POOL = 12;
const SCENERY_RANGE = 800;  // distancia visible delantera
const RECYCLE_DIST = 80;     // distancia trasera para reciclar

// Materiales reutilizables para árboles y montañas
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5D4037 });
const foliageMats = [
  new THREE.MeshStandardMaterial({ color: 0x388E3C, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0x43A047, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0x66BB6A, flatShading: true }),
];
const mountainMat = new THREE.MeshStandardMaterial({ color: 0x7986CB, roughness: 1, flatShading: true });

// Geometrías reutilizables
const trunkGeom = new THREE.CylinderGeometry(0.3, 0.4, 3, 6);
const foliageGeom = new THREE.ConeGeometry(2, 5, 7);
const mountainGeom = new THREE.ConeGeometry(30, 22, 5);
const snowGeom = new THREE.ConeGeometry(10.8, 7.9, 5);
const snowMat = new THREE.MeshStandardMaterial({ color: 0xF5F9FF, roughness: 1, flatShading: true });
const blobGeom = new THREE.IcosahedronGeometry(2.4, 1);

// --- Río con curvas: cadena de segmentos cortos que siguen riverCurveX ---
const RIVER_SEG_COUNT = 40;
const RIVER_SEG_LEN = 25;       // longitud de cada segmento (solapa con vecinos)
const RIVER_SEG_SPACING = 20;   // distancia entre centros de segmentos
const WATER_HALF_WIDTH = 7;      // ancho del agua (mitad) — coincide con RIVER_WIDTH/2
const BANK_HALF_WIDTH = 30;      // ancho de cada orilla (mitad)

// --- Carteles de distancia cada 250 m ---
const SIGN_INTERVAL = 100;        // metros entre carteles
const SIGNS_POOL = 8;             // nº de carteles simultáneos
const METERS_PER_UNIT = 1.389;    // conversión unidades de mundo → metros (1 u/s = 5 km/h)
const signs = [];
let signPostGeom, signPostMat, signBoardGeom;

// --- Peces ---
const FISH_POOL = 6;
const fishes = [];

const waterSegs = [];
const bankLSegs = [];
const bankRSegs = [];

function buildRiver() {
  const waterMat = new THREE.MeshStandardMaterial({ color: 0x29B6F6, roughness: 0.3, metalness: 0.6, side: THREE.DoubleSide });
  const bankMat = new THREE.MeshStandardMaterial({ color: 0x66BB6A, roughness: 0.9, side: THREE.DoubleSide });
  const waterGeom = new THREE.PlaneGeometry(WATER_HALF_WIDTH * 2, RIVER_SEG_LEN);
  const bankGeom = new THREE.BoxGeometry(BANK_HALF_WIDTH * 2, 3, RIVER_SEG_LEN);

  for (let i = 0; i < RIVER_SEG_COUNT; i++) {
    // Agua
    const w = new THREE.Mesh(waterGeom, waterMat);
    w.rotation.x = -Math.PI / 2;
    w.receiveShadow = true;
    scene.add(w);
    waterSegs.push(w);

    // Orilla izquierda
    const bl = new THREE.Mesh(bankGeom, bankMat);
    bl.receiveShadow = true;
    bl.castShadow = true;
    scene.add(bl);
    bankLSegs.push(bl);

    // Orilla derecha
    const br = new THREE.Mesh(bankGeom, bankMat);
    br.receiveShadow = true;
    br.castShadow = true;
    scene.add(br);
    bankRSegs.push(br);
  }

  // --- Pool de árboles ---
  for (let i = 0; i < TREE_POOL; i++) {
    const tree = new THREE.Group();
    const trunk = new THREE.Mesh(trunkGeom, trunkMat);
    trunk.position.y = 1.5;
    trunk.castShadow = true;
    tree.add(trunk);

    // 1 de cada 3 es un árbol de copa redonda; el resto son pinos de dos pisos
    const round = i % 3 === 2;
    const fm = foliageMats[(i >> 1) % 3];
    const foliage = new THREE.Mesh(round ? blobGeom : foliageGeom, fm);
    foliage.position.y = round ? 4.5 : 5;
    foliage.castShadow = true;
    tree.add(foliage);
    if (!round) {
      const top = new THREE.Mesh(foliageGeom, fm);
      top.scale.setScalar(0.7);
      top.position.y = 7.2;
      top.castShadow = true;
      tree.add(top);
    }

    placeTree(tree, -i * (SCENERY_RANGE / TREE_POOL));
    scene.add(tree);
    trees.push(tree);
  }

  // --- Pool de montañas lejanas ---
  for (let i = 0; i < MOUNTAIN_POOL; i++) {
    const m = new THREE.Mesh(mountainGeom, mountainMat);
    m.add(new THREE.Mesh(snowGeom, snowMat)); // nieve en la cima
    placeMountain(m, -i * 80);
    scene.add(m);
    mountains.push(m);
  }
}

function placeTree(tree, z) {
  const side = Math.random() < 0.5 ? -1 : 1;
  const cx = riverCurveX(z);
  tree.position.x = cx + side * (WATER_HALF_WIDTH + 4 + Math.random() * 25);
  tree.position.z = z;
  tree.position.y = 0;
  tree.scale.setScalar(0.7 + Math.random() * 0.6);
  tree.rotation.y = Math.random() * Math.PI;
}

function placeMountain(m, z) {
  const side = Math.random() < 0.5 ? -1 : 1;
  const cx = riverCurveX(z);
  // Radio base de la montaña escalada + margen del río
  const scale = 1 + Math.random();
  const mountainRadius = 30 * scale;
  const minDistance = WATER_HALF_WIDTH + BANK_HALF_WIDTH + mountainRadius * 0.5;
  const extra = Math.random() * 30;
  m.position.set(cx + side * (minDistance + extra), 6, z);
  m.scale.set(scale, 0.8 + Math.random() * 0.5, scale);
}

function updateScenery() {
  if (!boat) return;
  const bz = boat.position.z;

  // Posicionar cada segmento de agua y orilla a lo largo de la curva
  for (let i = 0; i < RIVER_SEG_COUNT; i++) {
    const segZ = bz + (i - RIVER_SEG_COUNT / 2) * RIVER_SEG_SPACING;
    const cx = riverCurveX(segZ);
    const heading = riverHeading(segZ);

    // Agua: centrada en el río, rotada según heading
    const w = waterSegs[i];
    w.position.set(cx, 0, segZ);
    w.rotation.z = heading;

    // Orilla izquierda: desplazada a la izquierda del río
    const offset = -WATER_HALF_WIDTH - BANK_HALF_WIDTH;
    const bl = bankLSegs[i];
    bl.position.set(cx + Math.cos(heading) * offset, -1, segZ - Math.sin(heading) * offset);
    bl.rotation.y = heading;

    // Orilla derecha: desplazada a la derecha del río
    const offsetR = WATER_HALF_WIDTH + BANK_HALF_WIDTH;
    const br = bankRSegs[i];
    br.position.set(cx + Math.cos(heading) * offsetR, -1, segZ - Math.sin(heading) * offsetR);
    br.rotation.y = heading;
  }

  // Reciclar árboles que quedan detrás de la barca
  for (const tree of trees) {
    if (tree.position.z > bz + RECYCLE_DIST) {
      placeTree(tree, bz - SCENERY_RANGE - Math.random() * 50);
    }
  }

  // Reciclar montañas
  for (const m of mountains) {
    if (m.position.z > bz + RECYCLE_DIST) {
      placeMountain(m, bz - SCENERY_RANGE - Math.random() * 100);
    }
  }

  updateSigns();
  updateDecor(bz);
}

// --- Decorado: cielo, sol, nubes, boyas, cañas y arbustos ---
const hash = n => { const v = Math.sin(n * 127.1) * 43758.5453; return v - Math.floor(v); };
const BUOY_N = 40, BUOY_SP = 12, REED_N = 100, REED_SP = 6, BUSH_N = 60, BUSH_SP = 10;
const CLOUD_N = 14;
let sky, buoys, reeds, bushes, lastBuoyBase = null;
const clouds = [];
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _sc = new THREE.Vector3(), _pp = new THREE.Vector3();
const _e = new THREE.Euler(), _c = new THREE.Color();

function buildDecor() {
  // Cielo: cúpula con degradado (sigue a la cámara, sin niebla)
  const g = new THREE.SphereGeometry(900, 24, 16);
  const top = new THREE.Color(0x2E7BC4), hor = new THREE.Color(HORIZON), cols = [];
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const t = Math.max(0, pos.getY(i) / 900);
    _c.copy(hor).lerp(top, Math.pow(t, 0.55));
    cols.push(_c.r, _c.g, _c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  sky = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
  sky.renderOrder = -2;
  scene.add(sky);

  // Sol (en la dirección de la luz direccional) con halo
  const dir = new THREE.Vector3(30, 50, -20).normalize().multiplyScalar(800);
  for (const [r, col, op] of [[28, 0xFFF6D0, 1], [70, 0xFFF0B0, 0.25]]) {
    const sun = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12),
      new THREE.MeshBasicMaterial({ color: col, fog: false, transparent: op < 1, opacity: op, depthWrite: false }));
    sun.position.copy(dir);
    sun.renderOrder = -1;
    sky.add(sun);
  }

  // Nubes: montones de esferas achatadas
  const cloudMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.92, fog: false });
  const puff = new THREE.SphereGeometry(1, 10, 8);
  for (let i = 0; i < CLOUD_N; i++) {
    const c = new THREE.Group();
    const n = 4 + Math.floor(Math.random() * 3);
    for (let j = 0; j < n; j++) {
      const p = new THREE.Mesh(puff, cloudMat);
      const r = 10 + Math.random() * 10;
      p.scale.set(r * 1.4, r * 0.6, r);
      p.position.set((j - n / 2) * 14 + Math.random() * 6, Math.random() * 4, Math.random() * 8);
      c.add(p);
    }
    c.position.set((Math.random() - 0.5) * 700, 90 + Math.random() * 60, -Math.random() * 600);

    scene.add(c);
    clouds.push(c);
  }

  // Boyas de calle (rojas/blancas) a ambos lados del agua
  buoys = new THREE.InstancedMesh(new THREE.SphereGeometry(0.22, 8, 6), new THREE.MeshStandardMaterial({ roughness: 0.5 }), BUOY_N * 2);
  buoys.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(BUOY_N * 2 * 3), 3);
  buoys.frustumCulled = false;
  scene.add(buoys);

  // Cañas en la orilla
  const reedGeom = new THREE.ConeGeometry(0.04, 1.1, 3);
  reedGeom.translate(0, 0.55, 0);
  reeds = new THREE.InstancedMesh(reedGeom, new THREE.MeshStandardMaterial({ color: 0x9CB84A, flatShading: true, side: THREE.DoubleSide }), REED_N * 2);
  reeds.frustumCulled = false;
  scene.add(reeds);

  // Arbustos
  bushes = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), new THREE.MeshStandardMaterial({ flatShading: true }), BUSH_N * 2);
  bushes.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(BUSH_N * 2 * 3), 3);
  bushes.frustumCulled = false;
  bushes.castShadow = true;
  scene.add(bushes);
}

// Posición en la orilla: off = distancia lateral al centro del río (con signo)
function riverPoint(z, off, out) {
  const h = riverHeading(z);
  return out.set(riverCurveX(z) + Math.cos(h) * off, 0, z - Math.sin(h) * off);
}

function updateDecor(bz) {
  const t = performance.now() / 1000;
  sky.position.copy(camera.position);

  for (const c of clouds) {
    c.position.x += c.userData.speed * 0.016;
    if (c.position.z > bz + 150) c.position.set(boat.position.x + (Math.random() - 0.5) * 700, 90 + Math.random() * 60, bz - 500 - Math.random() * 200);
  }

  // Todo lo instanciado se ancla al mundo con índices enteros (z = índice * separación)
  const bb = Math.round(bz / BUOY_SP);
  const setBuoys = lastBuoyBase !== bb;
  lastBuoyBase = bb;
  for (let k = 0; k < BUOY_N; k++) {
    const idx = bb + k - Math.floor(BUOY_N * 0.75);
    for (let s = 0; s < 2; s++) {
      const i = k * 2 + s;
      riverPoint(idx * BUOY_SP, (s ? 1 : -1) * (WATER_HALF_WIDTH - 0.8), _pp);
      _pp.y = 0.03 + Math.sin(t * 2 + idx + s) * 0.03;
      _m.makeTranslation(_pp.x, _pp.y, _pp.z);
      buoys.setMatrixAt(i, _m);
      if (setBuoys) buoys.setColorAt(i, _c.set(idx % 2 ? 0xE53935 : 0xFFFFFF));
    }
  }
  buoys.instanceMatrix.needsUpdate = true;
  if (setBuoys) buoys.instanceColor.needsUpdate = true;

  const rb = Math.round(bz / REED_SP);
  for (let k = 0; k < REED_N; k++) {
    const idx = rb + k - Math.floor(REED_N * 0.75);
    for (let s = 0; s < 2; s++) {
      const h = hash(idx * 2 + s);
      riverPoint(idx * REED_SP + h * 3, (s ? 1 : -1) * (WATER_HALF_WIDTH + 0.2 + h * 1.2), _pp);
      _pp.y = 0.5;
      const sc = 0.6 + hash(idx + s * 7.7) * 0.7;
      _q.setFromEuler(_e.set((h - 0.5) * 0.3, h * 6, 0));
      reeds.setMatrixAt(k * 2 + s, _m.compose(_pp, _q, _sc.set(sc, sc, sc)));
    }
  }
  reeds.instanceMatrix.needsUpdate = true;

  const bsb = Math.round(bz / BUSH_SP);
  for (let k = 0; k < BUSH_N; k++) {
    const idx = bsb + k - Math.floor(BUSH_N * 0.75);
    for (let s = 0; s < 2; s++) {
      const h = hash(idx * 3 + s + 0.5), h2 = hash(idx * 5 + s);
      riverPoint(idx * BUSH_SP + h2 * 5, (s ? 1 : -1) * (WATER_HALF_WIDTH + 2 + h * 12), _pp);
      const sc = 0.5 + h2 * 0.9;
      _pp.y = 0.5 + sc * 0.4;
      _q.setFromEuler(_e.set(0, h * 6, 0));
      const i = k * 2 + s;
      bushes.setMatrixAt(i, _m.compose(_pp, _q, _sc.set(sc * 1.3, sc * 0.8, sc * 1.3)));
      bushes.setColorAt(i, _c.setHSL(0.24 + h2 * 0.08, 0.7, 0.3 + h * 0.15));
    }
  }
  bushes.instanceMatrix.needsUpdate = true;
  bushes.instanceColor.needsUpdate = true;
}

// --- Carteles de distancia ---
function makeSignTexture(meters) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, 256, 128);
  ctx.fillStyle = '#000000';
  ctx.font = 'bold 52px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(meters + ' m', 128, 64);
  const tex = new THREE.CanvasTexture(c);
  return tex;
}

function buildSigns() {
  signBoardGeom = new THREE.BoxGeometry(2.2, 1.1, 0.1);

  for (let i = 0; i < SIGNS_POOL; i++) {
    const group = new THREE.Group();

    const board = new THREE.Mesh(signBoardGeom, new THREE.MeshStandardMaterial({ map: makeSignTexture(0) }));
    board.position.y = 1.0;
    board.castShadow = true;
    group.add(board);

    group.userData = { board, distance: 0, visible: false };
    group.visible = false;
    scene.add(group);
    signs.push(group);
  }
}

function updateSigns() {
  if (!boat) return;
  // Usar la mayor de: distancia BLE o distancia del juego
  const dist = gameState.gameDistance;
  const bz = gameState.boatZ;

  // Calcular qué múltiplos de 250m debemos mostrar
  // Mostramos carteles desde el último pasado hasta SIGNS_POOL por delante
  const lastPassed = Math.floor(dist / SIGN_INTERVAL) * SIGN_INTERVAL;

  for (let i = 0; i < SIGNS_POOL; i++) {
    const signDistance = lastPassed + (i + 1) * SIGN_INTERVAL;
    // Posición Z: si la distancia BLE y boatZ estuvieran perfectamente sincronizados,
    // el cartel estaría a (signDistance - dist) metros por delante del barco
    const metersAhead = signDistance - dist;
    const unitsAhead = metersAhead / METERS_PER_UNIT;
    const signZ = bz - unitsAhead;

    // Solo mostrar si está dentro del rango visible
    if (metersAhead < -SIGN_INTERVAL || metersAhead > SIGNS_POOL * SIGN_INTERVAL) {
      signs[i].visible = false;
      continue;
    }

    const sign = signs[i];
    sign.visible = true;

    // Actualizar textura si cambió la distancia
    if (sign.userData.distance !== signDistance) {
      sign.userData.distance = signDistance;
      const mat = sign.userData.board.material;
      if (mat.map) mat.map.dispose();
      mat.map = makeSignTexture(signDistance);
      mat.needsUpdate = true;
    }

    // Posicionar en la orilla derecha, siguiendo la curva del río
    const cx = riverCurveX(signZ);
    const heading = riverHeading(signZ);
    const sideOffset = WATER_HALF_WIDTH + 3;
    sign.position.x = cx + Math.cos(heading) * sideOffset;
    sign.position.z = signZ - Math.sin(heading) * sideOffset;
    sign.position.y = 0;
    sign.rotation.y = heading;
  }
}

// --- Peces que saltan a la superficie ---
function buildFishes() {
  const fishMat = new THREE.MeshStandardMaterial({ color: 0xC0C0C0, roughness: 0.3, metalness: 0.7, flatShading: true });
  const fishMat2 = new THREE.MeshStandardMaterial({ color: 0x607D8B, roughness: 0.3, metalness: 0.6, flatShading: true });
  for (let i = 0; i < FISH_POOL; i++) {
    const fish = new THREE.Group();
    const mat = i % 2 === 0 ? fishMat : fishMat2;
    const bodyGeom = new THREE.ConeGeometry(0.08, 0.4, 6);
    bodyGeom.rotateZ(Math.PI / 2);
    const body = new THREE.Mesh(bodyGeom, mat);
    fish.add(body);
    const tailGeom = new THREE.ConeGeometry(0.06, 0.12, 4);
    tailGeom.rotateY(Math.PI / 2);
    tailGeom.rotateZ(-Math.PI / 2);
    const tail = new THREE.Mesh(tailGeom, mat);
    tail.position.x = -0.26;
    fish.add(tail);
    fish.userData = { active: false, timer: 0, nextJump: 2 + Math.random() * 8 };
    fish.visible = false;
    scene.add(fish);
    fishes.push(fish);
  }
}

function updateFish(dt) {
  if (!boat) return;
  const bz = gameState.boatZ;
  for (const fish of fishes) {
    if (!fish.userData.active) {
      fish.userData.nextJump -= dt;
      if (fish.userData.nextJump <= 0) {
        const offsetZ = -5 - Math.random() * 30;
        const offsetX = (Math.random() - 0.5) * (WATER_HALF_WIDTH * 1.5);
        const z = bz + offsetZ;
        const cx = riverCurveX(z);
        const heading = riverHeading(z);
        fish.position.set(
          cx + Math.cos(heading) * offsetX,
          0,
          z - Math.sin(heading) * offsetX
        );
        fish.rotation.y = heading + Math.PI / 2;
        fish.userData.active = true;
        fish.userData.timer = 0;
        fish.userData.duration = 0.8 + Math.random() * 0.6;
        fish.visible = true;
      }
    } else {
      fish.userData.timer += dt;
      const p = fish.userData.timer / fish.userData.duration;
      if (p >= 1) {
        fish.userData.active = false;
        fish.visible = false;
        fish.userData.nextJump = 3 + Math.random() * 10;
      } else {
        const arc = Math.sin(p * Math.PI);
        fish.position.y = arc * 0.8;
        fish.rotation.z = arc * 0.6 * (fish.position.x < boat.position.x ? 1 : -1);
      }
    }
  }
}

// ========================================================================
//  EMBARCACION — single scull (skiff) con remero articulado por IK
//  Ejes locales: proa = -Z (sentido de la marcha), popa = +Z, arriba = +Y.
//  El remero mira a popa (+Z), con los pies en la plancha de popa.
//  Origen Y: la linea de flotacion queda en y = -0.08 (el barco se sube +0.08).
// ========================================================================
const HULL_LEN = 7.5, HULL_HB = 0.25, HULL_DEPTH = 0.22;
const hullT = z => (z + HULL_LEN / 2) / HULL_LEN;
const hullHB = t => HULL_HB * Math.pow(Math.sin(Math.PI * t), 0.6);
const hullDepth = t => HULL_DEPTH * Math.pow(Math.sin(Math.PI * t), 0.8);
const hullSheer = t => 0.09 + 0.08 * Math.pow(Math.abs(2 * t - 1), 3); // proa/popa levantadas

// Cotas del aparejo (z positivo = popa)
const COCKPIT_Z0 = -0.9, COCKPIT_Z1 = 1.1;
const SEAT_C = 0.45, SLIDE = 0.5;   // asiento: z en el catch y recorrido
const HIP_Y = 0.17;                 // altura de la cadera sobre el asiento
const PIN_X = 0.8, PIN_Z = 0.5;     // oarlocks (en los riggers)
const PIN_Y = { '-1': 0.24, '1': 0.2 }; // un remo mas alto que otro para que no choquen las manos
const OAR_IN = 0.9, OAR_OUT = 2.0, GRIP = 0.78;
const ARM = [0.33, 0.31], LEG = [0.44, 0.44]; // hueso superior/inferior

let _shellGeo = null;
function shellGeometries() {
  if (_shellGeo) return _shellGeo;
  const N = 40, M = 10, v = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, z = -HULL_LEN / 2 + t * HULL_LEN;
    const hb = hullHB(t), d = hullDepth(t), sh = hullSheer(t);
    for (let j = 0; j <= M; j++) {
      const a = (j / M) * Math.PI; // 0 = estribor, PI = babor
      v.push(hb * Math.cos(a), sh - d * Math.sin(a), z);
    }
  }
  for (let i = 0; i < N; i++) for (let j = 0; j < M; j++) {
    const a = i * (M + 1) + j, c = a + M + 1;
    idx.push(a, c, a + 1, a + 1, c, c + 1);
  }
  const hull = new THREE.BufferGeometry();
  hull.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  hull.setIndex(idx);
  hull.computeVertexNormals();

  // Cubierta: tira plana a la altura de la borda entre dos z
  const deck = (z0, z1) => {
    const n = 14, dv = [], di = [];
    for (let i = 0; i <= n; i++) {
      const z = z0 + (z1 - z0) * i / n, t = hullT(z), hb = hullHB(t), y = hullSheer(t) + 0.004;
      dv.push(-hb, y, z, hb, y, z);
    }
    for (let i = 0; i < n; i++) di.push(2 * i, 2 * i + 1, 2 * i + 2, 2 * i + 1, 2 * i + 3, 2 * i + 2);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(dv, 3));
    g.setIndex(di);
    g.computeVertexNormals();
    return g;
  };
  _shellGeo = { hull, foreDeck: deck(-HULL_LEN / 2, COCKPIT_Z0), aftDeck: deck(COCKPIT_Z1, HULL_LEN / 2) };
  return _shellGeo;
}

// --- Helpers de huesos ---
const _Y = new THREE.Vector3(0, 1, 0), _d = new THREE.Vector3(), _p = new THREE.Vector3();
function bone(r, len, mat, parent) {
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, len - 2 * r, 4, 10), mat);
  m.castShadow = true;
  parent.add(m);
  return m;
}
function placeBone(m, a, b) {
  m.position.addVectors(a, b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(_Y, _d.subVectors(b, a).normalize());
}
// IK de 2 huesos en 3D. Mueve `T` al punto alcanzable mas cercano y devuelve el codo/rodilla en `E`.
function solveLimb(S, T, l1, l2, pole, E) {
  _d.subVectors(T, S);
  const d = Math.min(Math.max(_d.length(), Math.abs(l1 - l2) + 1e-3), l1 + l2 - 1e-3);
  _d.normalize();
  T.copy(S).addScaledVector(_d, d);
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  _p.copy(pole).addScaledVector(_d, -pole.dot(_d)).normalize();
  E.copy(S).addScaledVector(_d, a).addScaledVector(_p, h);
}

// --- Remo (sculls): mango, fuste y pala eliptica. Se construye hacia +X*side ---
function buildOar(side, bladeColor) {
  const oar = new THREE.Group();
  const roll = new THREE.Group(); // el "feathering" gira el remo sobre su eje
  oar.add(roll);
  oar.userData.roll = roll;
  const at = (m, x) => { m.position.x = x; m.castShadow = true; roll.add(m); return m; };

  const len = OAR_IN + OAR_OUT;
  const shaft = new THREE.CylinderGeometry(0.022, 0.026, len, 10).rotateZ(Math.PI / 2);
  at(new THREE.Mesh(shaft, new THREE.MeshStandardMaterial({ color: 0x212121, roughness: 0.4 })), side * (OAR_OUT - OAR_IN) / 2);
  const grip = new THREE.CylinderGeometry(0.033, 0.033, 0.24, 10).rotateZ(Math.PI / 2);
  at(new THREE.Mesh(grip, new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 })), -side * GRIP);
  const sleeve = new THREE.CylinderGeometry(0.04, 0.04, 0.06, 10).rotateZ(Math.PI / 2);
  at(new THREE.Mesh(sleeve, new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.5 })), 0);
  // Pala: elipse 0.5 x 0.2, plana, en el extremo exterior
  const blade = new THREE.CylinderGeometry(1, 1, 0.015, 24).rotateX(Math.PI / 2).scale(0.25, 0.1, 1);
  at(new THREE.Mesh(blade, new THREE.MeshStandardMaterial({ color: bladeColor, roughness: 0.4, side: THREE.DoubleSide })), side * (OAR_OUT - 0.25));
  return oar;
}

// --- Construye barco + remero + remos. Devuelve el Group (userData.rig guarda las piezas animables) ---
function buildShell(hullColor, shirtColor, bladeColor) {
  const shell = new THREE.Group();
  const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.5, ...o });
  const mesh = (geo, mat, parent = shell) => { const m = new THREE.Mesh(geo, mat); m.castShadow = true; parent.add(m); return m; };
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const rod = (a, b, r, mat) => { // varilla entre dos puntos
    const m = mesh(new THREE.CylinderGeometry(r, r, 1, 6), mat);
    placeBone(m, a, b);
    m.scale.y = a.distanceTo(b);
  };

  const g = shellGeometries();
  const hullMat = M(hullColor, { roughness: 0.3, metalness: 0.1, side: THREE.DoubleSide });
  const deckMat = M(new THREE.Color(hullColor).lerp(new THREE.Color(0xffffff), 0.25), { side: THREE.DoubleSide });
  const hull = mesh(g.hull, hullMat); hull.receiveShadow = true;
  mesh(g.foreDeck, deckMat); mesh(g.aftDeck, deckMat);

  const metal = M(0xCFD8DC, { roughness: 0.25, metalness: 0.7 });
  const dark = M(0x263238, { roughness: 0.7 });
  const white = M(0xFFFFFF);

  // Bola de proa, coaming y suelo de la cala
  mesh(new THREE.SphereGeometry(0.035, 10, 8), white).position.set(0, hullSheer(0) , -HULL_LEN / 2 - 0.01);
  for (const s of [-1, 1]) {
    const hb = HULL_HB, y = hullSheer(0.5) + 0.01;
    rod(V(s * hb, y, COCKPIT_Z0), V(s * hb, y, COCKPIT_Z1), 0.014, white);
  }
  const floor = mesh(new THREE.BoxGeometry(0.4, 0.01, COCKPIT_Z1 - COCKPIT_Z0), dark);
  floor.position.set(0, -0.03, (COCKPIT_Z0 + COCKPIT_Z1) / 2);

  // Carriles + asiento
  for (const s of [-1, 1]) mesh(new THREE.BoxGeometry(0.025, 0.05, 1.0), metal).position.set(s * 0.11, 0.0, 0.2);
  const seat = mesh(new THREE.BoxGeometry(0.3, 0.05, 0.3), dark);
  seat.position.y = 0.065;

  // Plancha de pies (inclinada) + zapatos; el tobillo es el objetivo del IK de las piernas
  const TILT = 0.5;
  const up = V(0, Math.cos(TILT), Math.sin(TILT));    // hacia arriba a lo largo de la plancha
  const nr = V(0, Math.sin(TILT), -Math.cos(TILT));   // normal hacia el remero
  const plate = mesh(new THREE.BoxGeometry(0.42, 0.28, 0.02), metal);
  plate.rotation.x = TILT;
  plate.position.set(0, 0.12, 0.9);
  const shoeMat = M(0xF5F5F5, { roughness: 0.6 });
  const ankles = {};
  for (const s of [-1, 1]) {
    const c = V(s * 0.13, 0.12, 0.9).addScaledVector(nr, 0.07);
    const shoe = mesh(new THREE.BoxGeometry(0.11, 0.27, 0.09), shoeMat);
    shoe.position.copy(c);
    shoe.rotation.x = TILT;
    ankles[s] = c.clone().addScaledVector(up, -0.07).addScaledVector(nr, 0.05);
  }

  // Riggers: cercha de dos varillas desde la borda hasta el oarlock + pin
  const oars = {};
  for (const s of [-1, 1]) {
    const pin = V(s * PIN_X, 0.1, PIN_Z);
    for (const dz of [-0.3, 0.3]) {
      const z = PIN_Z + dz;
      rod(V(s * hullHB(hullT(z)), hullSheer(hullT(z)), z), pin, 0.012, metal);
    }
    rod(pin, V(s * PIN_X, PIN_Y[s] + 0.02, PIN_Z), 0.012, metal);
    const oar = buildOar(s, bladeColor);
    oar.position.set(s * PIN_X, PIN_Y[s], PIN_Z);
    shell.add(oar);
    oars[s] = oar;
  }

  // --- Remero ---
  const skin = M(0xF0C29B, { roughness: 0.6 }), shirt = M(shirtColor), shorts = M(0x1A237E, { roughness: 0.6 });
  const hips = new THREE.Group();
  hips.position.y = HIP_Y;
  shell.add(hips);
  mesh(new THREE.CapsuleGeometry(0.1, 0.18, 4, 10).rotateZ(Math.PI / 2), shorts, hips);

  const spine = new THREE.Group(); // pivota en la cadera para inclinar el tronco
  spine.position.y = 0.08;
  hips.add(spine);
  const torso = mesh(new THREE.CapsuleGeometry(0.15, 0.22, 4, 12).scale(1.3, 1, 0.8), shirt, spine);
  torso.position.y = 0.26;
  mesh(new THREE.CylinderGeometry(0.05, 0.055, 0.1, 8), skin, spine).position.y = 0.56;
  const head = mesh(new THREE.SphereGeometry(0.115, 18, 14).scale(0.92, 1.1, 1), skin, spine);
  head.position.y = 0.72;
  const hair = mesh(new THREE.SphereGeometry(0.122, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.6).scale(0.95, 1.1, 1.02), M(0x3E2723, { roughness: 0.8 }), spine);
  hair.position.y = 0.72;
  hair.rotation.x = -0.4; // cubre nuca y coronilla; la cara (+Z) queda libre
  for (const s of [-1, 1]) mesh(new THREE.SphereGeometry(0.014, 6, 6), M(0x111111), spine).position.set(s * 0.042, 0.735, 0.11);

  // Huesos (en el marco del barco; se recolocan cada frame)
  const limbs = {};
  for (const s of [-1, 1]) {
    limbs[s] = {
      arm: [bone(0.052, ARM[0], shirt, shell), bone(0.04, ARM[1], skin, shell)],
      hand: mesh(new THREE.SphereGeometry(0.045, 8, 6), skin),
      leg: [bone(0.075, LEG[0], shorts, shell), bone(0.055, LEG[1], skin, shell)],
      ankle: ankles[s],
    };
  }

  shell.userData.rig = { seat, hips, spine, oars, limbs };
  return shell;
}

// Curva de la remada: d = 0 catch (comprimido), 1 finish (extendido). Drive = 35% del ciclo.
function strokeD(phase) {
  if (phase < 0.35) { const u = phase / 0.35; return u * u * (3 - 2 * u); }
  return 0.5 + 0.5 * Math.cos(Math.PI * (phase - 0.35) / 0.65);
}
// 0 = pala en el agua, 1 = fuera (recobro)
function bladeLiftAt(phase) {
  if (phase < 0.35) return 0;
  if (phase < 0.45) return (phase - 0.35) / 0.1;
  if (phase < 0.9) return 1;
  return 1 - (phase - 0.9) / 0.1;
}

const _S = new THREE.Vector3(), _T = new THREE.Vector3(), _E = new THREE.Vector3(), _pole = new THREE.Vector3();
const _ease = x => x * x * (3 - 2 * x);
function animateShell(shell, d, lift) {
  const r = shell.userData.rig;
  // Secuencia real: piernas -> espalda -> brazos (y al reves en el recobro)
  const seatZ = SEAT_C - SLIDE * _ease(Math.min(d / 0.7, 1));
  const lean = 0.45 - 0.75 * _ease(Math.max(0, (d - 0.25) / 0.75)); // + = hacia popa (hacia donde mira)
  r.seat.position.z = seatZ;
  r.hips.position.z = seatZ;
  r.spine.rotation.x = lean;

  const alpha = 0.85 - 1.47 * d;    // barrido: + = pala hacia proa (catch), - = hacia popa (finish)
  const beta = 0.16 - 0.22 * lift;  // cabeceo: + = pala hacia el agua
  const roll = lift * 1.35;         // pala plana en el recobro, vertical en el agua
  const cl = Math.cos(lean), sl = Math.sin(lean);

  for (const s of [-1, 1]) {
    const oar = r.oars[s], L = r.limbs[s];
    oar.rotation.set(0, s * alpha, -s * beta);
    oar.userData.roll.rotation.x = roll;
    oar.updateMatrix();

    // Brazos: hombro (sigue al tronco) -> mango del remo
    _S.set(s * 0.21, HIP_Y + 0.08 + 0.46 * cl, seatZ + 0.46 * sl);
    _T.set(-s * GRIP, 0, 0).applyMatrix4(oar.matrix);
    solveLimb(_S, _T, ARM[0], ARM[1], _pole.set(s * 0.6, -0.6, -0.8), _E);
    placeBone(L.arm[0], _S, _E); placeBone(L.arm[1], _E, _T);
    L.hand.position.copy(_T);

    // Piernas: cadera -> tobillo fijo en la plancha; rodilla hacia arriba y afuera
    _S.set(s * 0.1, HIP_Y, seatZ);
    _T.copy(L.ankle);
    solveLimb(_S, _T, LEG[0], LEG[1], _pole.set(s * 0.3, 1, 0), _E);
    placeBone(L.leg[0], _S, _E); placeBone(L.leg[1], _E, _T);
  }
}

function updateRowerAnimation(dt) {
  const cadence = gameState.cadence;
  if (cadence > 0) {
    const cycleTime = 60 / cadence;
    gameState.strokePhase += dt / cycleTime;
    if (gameState.strokePhase >= 1) {
      gameState.strokePhase -= 1;
      // Si era remada manual, no reiniciar ciclo automáticamente
      if (gameState._manualStroke && gameState._manualStroke > 0) {
        gameState._manualStroke = 0;
        gameState.cadence = 0;
        gameState.strokePhase = 0;
        $sCadence.textContent = '0 spm';
      }
    }
  } else if (gameState.strokePhase > 0.001) {
    gameState.strokePhase = gameState.strokePhase * 0.92;
  } else {
    gameState.strokePhase = 0;
  }

  const phase = gameState.strokePhase;
  animateShell(boat, strokeD(phase), bladeLiftAt(phase));

  // --- Balanceo de la barca ---
  boat.rotation.z = Math.sin(phase * Math.PI * 2) * 0.01;
  boat.rotation.x = Math.sin(phase * Math.PI * 2) * 0.008;
  boat.position.y = Math.sin(phase * Math.PI * 2) * 0.03 + 0.08;
}

// --- Movimiento de la barca (delegado al modelo físico) ---
function updateBoatMovement(dt) {
  updateBoatPhysics(dt);
}

// ========================================================================
//  BOTS — embarcaciones de referencia a velocidad constante
// ========================================================================
const BOT_CONFIGS = [
  { velocity: 0.8, cadence: 20, lane: -2.5, color: 0x1565C0, name: 'Lento' },
  { velocity: 1.5, cadence: 26, lane:  2.5, color: 0x2E7D32, name: 'Medio' },
  { velocity: 2.2, cadence: 32, lane: -1.0, color: 0xE65100, name: 'Rápido' },
  { velocity: 1.1, cadence: 23, lane:  1.0, color: 0x6A1B9A, name: 'Pacífico' },
];

function buildBots() {
  for (const cfg of BOT_CONFIGS) {
    const botBoat = buildShell(cfg.color, 0xFFFFFF, cfg.color);
    botBoat.userData.velocity = cfg.velocity;
    botBoat.userData.cadence = cfg.cadence;
    botBoat.userData.lane = cfg.lane;
    botBoat.userData.name = cfg.name;
    botBoat.userData.phase = Math.random();
    botBoat.userData.zOffset = -10 - Math.random() * 40;
    const bz = gameState.boatZ + botBoat.userData.zOffset;
    botBoat.position.set(riverCurveX(bz) + cfg.lane, 0, bz);
    botBoat.rotation.y = riverHeading(bz);
    scene.add(botBoat);
    bots.push(botBoat);
  }
}

function updateBots(dt) {
  for (const bot of bots) {
    const ud = bot.userData;
    const cadence = ud.cadence;

    if (cadence > 0) {
      const cycleTime = 60 / cadence;
      ud.phase = (ud.phase + dt / cycleTime) % 1;
    }

    animateShell(bot, strokeD(ud.phase), bladeLiftAt(ud.phase));

    // Mover bot
    bot.position.z -= ud.velocity * dt;

    // Reciclar si está muy lejos delante o detrás del jugador
    const distFromPlayer = bot.position.z - gameState.boatZ;
    if (distFromPlayer < -120) {
      bot.position.z = gameState.boatZ + 30 + Math.random() * 20;
    } else if (distFromPlayer > 60) {
      bot.position.z = gameState.boatZ - 60 - Math.random() * 30;
    }

    // Seguir la curva del río (X + heading)
    const bz = bot.position.z;
    const cx = riverCurveX(bz);
    bot.position.x = cx + ud.lane;
    bot.rotation.y = riverHeading(bz);

    // Balanceo suave
    bot.rotation.z = Math.sin(ud.phase * Math.PI * 2) * 0.01;
    bot.position.y = Math.sin(ud.phase * Math.PI * 2) * 0.03 + 0.08;
  }
}

// --- Cámara ---
function updateCamera(dt) {
  if (!boat) return;
  const bx = boat.position.x;
  const bz = boat.position.z;
  const heading = boat.rotation.y;
  // Vectores local→mundo: forward apunta hacia -Z del barco rotado
  const sinH = Math.sin(heading), cosH = Math.cos(heading);

  let targetX, targetY, targetZ;
  let lookX, lookY, lookZ;

  if (cameraMode === 0) {
    // Trasera: detrás (+Z local) y por encima
    targetX = bx + sinH * 7;
    targetY = 4;
    targetZ = bz + cosH * 7;
    lookX = bx - sinH * 5; lookY = 1; lookZ = bz - cosH * 5;
  } else if (cameraMode === 1) {
    // Lateral (perpendicular al rumbo)
    targetX = bx + cosH * 8;
    targetY = 3;
    targetZ = bz - sinH * 8;
    lookX = bx; lookY = 1; lookZ = bz;
  } else {
    // Cinemática: más alta y lejana
    targetX = bx + sinH * 12 + cosH * 3;
    targetY = 10;
    targetZ = bz + cosH * 12 - sinH * 3;
    lookX = bx; lookY = 0; lookZ = bz - cosH * 10;
  }

  camera.position.x += (targetX - camera.position.x) * 0.05;
  camera.position.y += (targetY - camera.position.y) * 0.05;
  camera.position.z += (targetZ - camera.position.z) * 0.05;
  camera.lookAt(lookX, lookY, lookZ);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function updateGoalHUD(dt) {
  const hud = document.getElementById('goal-hud');
  const labelEl = document.getElementById('goal-label');
  const valueEl = document.getElementById('goal-value');
  const subEl = document.getElementById('goal-sub');
  const rowerEl = document.getElementById('goal-rower');
  const timeEl = document.getElementById('goal-time');

  if (gameState.goalMode === 'free') {
    hud.classList.add('visible');
    timeEl.textContent = formatDuration(gameState.exerciseTime);
    labelEl.textContent = 'Estimated';
    valueEl.textContent = Math.round(gameState.gameDistance) + ' m';
    rowerEl.textContent = 'Rower: ' + Math.round(gameState.distance) + ' m';
    subEl.textContent = '';
    valueEl.classList.remove('finished');
    return;
  }

  timeEl.textContent = '';

  if (!gameState.goalValue) {
    hud.classList.remove('visible');
    rowerEl.textContent = '';
    return;
  }

  hud.classList.add('visible');

  if (gameState.goalMode === 'time') {
    const remaining = Math.max(0, gameState.goalValue - gameState.exerciseTime);
    const mins = Math.floor(remaining / 60);
    const secs = Math.floor(remaining % 60);
    valueEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    labelEl.textContent = 'Time left';
    rowerEl.textContent = '';
    subEl.textContent = '';
    if (remaining <= 0) {
      valueEl.classList.add('finished');
      valueEl.textContent = '00:00';
      subEl.textContent = 'Goal completed! 🎉';
    } else {
      valueEl.classList.remove('finished');
    }
  } else if (gameState.goalMode === 'distance') {
    const dist = gameState.gameDistance;
    const remaining = Math.max(0, gameState.goalValue - dist);
    valueEl.textContent = Math.round(remaining) + ' m';
    labelEl.textContent = 'Distance left';
    rowerEl.textContent = 'Rower: ' + Math.round(gameState.distance) + ' m';
    subEl.textContent = '';
    if (remaining <= 0) {
      valueEl.classList.add('finished');
      subEl.textContent = 'Goal completed! 🎉';
    } else {
      valueEl.classList.remove('finished');
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  if (paused) { renderer.render(scene, camera); return; }
  const dt = Math.min(clock.getDelta(), 0.1);

  updateRowerAnimation(dt);
  updateBoatMovement(dt);
  updateBots(dt);
  updateCamera(dt);
  updateScenery();
  updateFish(dt);
  updateGoalHUD(dt);

  renderer.render(scene, camera);
}

const uuid = (n) => '0000' + n.toString(16).padStart(4,'0') + '-0000-1000-8000-00805f9b34fb';
const DOMYOS_SERVICE_UUID = '49535343-fe7d-4ae5-8fa9-9fafd205e455';
const DOMYOS_NOTIFY_UUID   = '49535343-1e4d-4bd9-ba61-23c647249616';
const DOMYOS_WRITE_UUID    = '49535343-8841-43f4-a8d4-ecbe34729bb3';
const DEVICE_INFO_SERVICE_UUID = uuid(0x180a);

function setStatus(msg, ok) {
  $sStatus.textContent = msg;
  $sStatus.className = 'stat-value ' + (ok ? 'connected' : 'disconnected');
}
function logRaw(cls, text) {
  const now = new Date().toLocaleTimeString('es-ES', { hour12: false });
  const line = document.createElement('div');
  line.innerHTML = `<span class="${cls}">${now} ${text}</span>`;
  $log.appendChild(line);
  $log.scrollTop = $log.scrollHeight;
  while ($log.children.length > 50) $log.removeChild($log.firstChild);
}
function toHex(buf) {
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join(' ');
}
function checksum(bytes) { return bytes.reduce((a, b) => a + b, 0) & 0xFF; }

async function sendCommand(bytes) {
  if (!writeChar) return;
  const cmd = new Uint8Array(bytes);
  logRaw('cmd', `>>> TX: ${toHex(cmd.buffer)}`);
  try { await writeChar.writeValue(cmd); }
  catch(e) { logRaw('cmd', `Error: ${e.message}`); }
}

const INIT_COMMANDS = [
  [0xF0, 0xA3, 0x93],
  [0xF0, 0xA4, 0x94],
  [0xF0, 0xA5, 0x95],
  [0xF0, 0xAB, 0x9B],
];

async function sendInitSequence() {
  logRaw('svc', '=== Init ===');
  for (const cmd of INIT_COMMANDS) {
    await sendCommand(cmd);
    await new Promise(r => setTimeout(r, 100));
  }
  if (keepaliveInterval) clearInterval(keepaliveInterval);
  keepaliveInterval = setInterval(() => sendCommand([0xF0, 0xAC, 0x9C]), 300);
  logRaw('svc', 'Keepalive iniciado');
}

function parseDomyosRowerData(dv) {
  const bytes = new Uint8Array(dv.buffer);
  if (bytes.length < 20 || bytes[0] !== 0xF0) return null;

  const strokes = (bytes[2] << 8) | bytes[3];
  const pace = (bytes[6] << 8) | bytes[7];
  const cadence = bytes[9];
  const calories = (bytes[10] << 8) | bytes[11];
  const distRaw = (bytes[12] << 8) | bytes[13];
  const resistance = bytes[14];
  const heartRate = bytes[18];
  const inclination = bytes[21];

  let speed = 0;
  if (pace > 0 && pace < 0xFFFF) {
    speed = parseFloat(((60 / pace) * 30).toFixed(1));
  }

  const distance = distRaw * 100;

  // Actualizar estado del juego
  // La velocidad NO se asigna directamente: el modelo físico la calcula
  gameState.cadence = cadence;
  gameState.strokes = strokes;
  gameState.distance = distance;
  // Marcar el objetivo BLE para corrección gradual en updateBoatPhysics
  if (distance > gameState.bleDistanceTarget) {
    gameState.bleDistanceTarget = distance;
  }
  gameState.lastBLEDistance = distance;
  gameState.resistance = resistance;
  gameState.calories = calories;
  gameState.heartRate = heartRate;
  gameState.inclination = inclination;
  lastBLEPacketTime = clock.elapsedTime;

  // Detectar nueva remada vía stroke count → aplicar impulso inmediato
  if (strokes > gameState.lastBLEStrokes) {
    applyStrokeImpulse();
    gameState.lastBLEStrokes = strokes;
  }

  // Actualizar HUD (la velocidad la actualiza updateBoatPhysics)
  $sCadence.textContent = cadence + ' spm';
  $sStrokes.textContent = strokes;
  $sDist.textContent = Math.round(gameState.gameDistance) + ' m';
  $sResist.textContent = resistance || '—';
  $sCal.textContent = calories + ' kcal';
  $sHR.textContent = heartRate > 0 ? heartRate + ' bpm' : '—';
  $sIncl.textContent = inclination || '—';

  return true;
}

function onDomyosNotify(e) {
  const dv = e.target.value;
  const bytes = new Uint8Array(dv.buffer);
  logRaw('hex', `<<< RX [${bytes.length}B]: ${toHex(dv.buffer)}`);
  if (bytes.length === 26 && bytes[0] === 0xF0) {
    try { parseDomyosRowerData(dv); } catch(err) {
      logRaw('hex', `(parse error: ${err.message})`);
    }
  }
}

async function exploreServer(server) {
  logRaw('svc', 'Buscando servicio Domyos...');
  try {
    const svc = await server.getPrimaryService(DOMYOS_SERVICE_UUID);
    logRaw('svc', 'Servicio Domyos encontrado');
    await setupDomyosService(svc);
  } catch(err) {
    logRaw('svc', `getPrimaryService falló: ${err.message}`);
  }
}

async function setupDomyosService(svc) {
  const chars = await svc.getCharacteristics();
  for (const ch of chars) {
    if (ch.uuid === DOMYOS_NOTIFY_UUID) {
      notifyChar = ch;
      ch.addEventListener('characteristicvaluechanged', onDomyosNotify);
      await ch.startNotifications();
      logRaw('svc', 'Suscrito a Notify');
    }
    if (ch.uuid === DOMYOS_WRITE_UUID) {
      writeChar = ch;
      logRaw('svc', 'Write characteristic lista');
    }
  }
  if (writeChar) await sendInitSequence();
}

    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [DOMYOS_SERVICE_UUID, DEVICE_INFO_SERVICE_UUID]
    });
    setStatus('Connecting...', false);
    device.addEventListener('gattserverdisconnected', () => {
      setStatus('Disconnected', false);
      $btn.disabled = false;
      gameState.cadence = 0;
      lastBLEPacketTime = 0;
      if (keepaliveInterval) { clearInterval(keepaliveInterval); keepaliveInterval = null; }
    });
    server = await device.gatt.connect();
    setStatus('Connected', true);
    await exploreServer(server);
    setStatus('Rowing', true);
  } catch (err) {
    setStatus('Error: ' + err.message, false);
    $btn.disabled = false;
  }
});
